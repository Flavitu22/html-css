    <style>
    /* Estilo da div que agrupa os vídeos */
    .video-container {
        display: flex;              /* Layout flexível */
        flex-wrap: wrap;            /* Quebra de linha automática */
        gap: 15px;                  /* Espaço entre vídeos */
        justify-content: center;    /* Centraliza os vídeos */
        padding: 20px;
        background-color: #1dbf08;
        border-radius: 8px;
    }

    /* Estilo para cada vídeo */
    .video-container iframe,
    .video-container video {
        width: 320px;
        height: 180px;
        border: none;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Responsividade */
    @media (max-width: 600px) {
        .video-container iframe,
        .video-container video {
            width: 100%;
            height: auto;
        }
    }
</style>
