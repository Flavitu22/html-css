<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="shortcut icon" href="../ex004/favicon-f.ico" type="image/x-icon">
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background-image: url(../desafios/d013/imagens/flores.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            }


        td {
            border: 2px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: sub;
            }
            table{
                width: 400px;
                height: 200px;
                border: 8px solid rgb(131, 12, 149);
                table-layout: fixed;
                border-collapse: collapse;
                box-shadow: 3px 2px 0 black;
                }
            tr{
                color: rgb(7, 81, 81);
                background-color: grey;
            }
            td.ielu{
                background-color: violet;
            }
            td.guin {
                background-color: thistle;
            }
    </style>
</head>
<body>
    <main>
        <h1> Editando Tabelas</h1>
        <table>
            <tr>
                <td>A1</td>
                <td>A2</td>
                <td>A3</td>
                <td>A4</td>
            </tr>
            <tr>
                <td>B1</td>
                <td>B2</td>
                <td>B3</td>
                <td>B4</td>
            </tr>
            <tr>
                <td>C1</td>
                <td class="ielu">C2</td>
                <td>C3</td>
                <td class="guin">C4</td>
            </tr>
        
                <td>D1</td>
                <td>D2</td>
                <td>D3</td>
                <td>D4</td>
        </table>
    </main>
            <footer>  Footer</footer>
</body>
     
 
</html>
