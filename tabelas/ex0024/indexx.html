<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura com Bordas</title>
    <style>
        /* Estilo para aplicar as bordas sólidas de 2px */
        header {
            border: 2px solid red; /* Borda vermelha no cabeçalho */
            padding: 20px;
            margin-bottom: 10px;
        }

        main {
            border: 2px solid blue; /* Borda azul no corpo/conteúdo */
            padding: 20px;
            margin-bottom: 10px;
            min-height: 200px; /* Apenas para dar altura ao corpo */
        }

        footer {
            border: 2px solid green; /* Borda verde no rodapé */
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cabeçalho (Header)</h1>
        <p> Site1.</p>
    </header>

    <main>
        <h2>Corpo (Main/Content)</h2>
        <p>Este é o conteúdo principal da sua página.</p>
    </main>

    <footer>
        <p>Rodapé (Footer) &copy; 2024 - Informações de contato e links úteis.</p>
    </footer>

</body>
</html>
